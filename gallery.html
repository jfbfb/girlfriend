<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>属于我们的温柔时刻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-gallery">
  <div class="decor-layer" aria-hidden="true">
    <div class="dream-glow"></div>
    <div class="bokeh"></div>
    <div class="mist"></div>
    <div class="stars"></div>
    <div class="floating-hearts">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="heart-rain"></div>
    <div class="petals"></div>
    <div class="romance-vignette"></div>
  </div>

  <!-- 右上角控制区 -->
  <div class="top-controls" id="topControls">
    <button type="button" class="btn-add-photo" id="addPhotoBtn" title="添加照片" aria-label="添加照片">+</button>
    <button type="button" class="btn-rules" id="rulesBtn" title="规则说明" aria-label="规则说明">规则</button>
    <div class="rules-bubble" id="rulesBubble" role="status" aria-live="polite">
      有不懂的地方可以点这里查看玩法说明
    </div>
  </div>
  <input type="file" id="addPhotoInput" accept="image/*" multiple hidden>

  <!-- 入场暖心情侣文案 -->
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-content">
      <p class="intro-line">遇见你之后，平凡的日子都有了光。</p>
      <p class="intro-line intro-line-sub">愿每一帧，都是我们。</p>
      <button type="button" class="intro-skip" id="introSkip">轻触继续</button>
    </div>
  </div>

  <!-- 照片拖尾层 -->
  <canvas class="trail-layer" id="trailCanvas" aria-hidden="true"></canvas>

  <!-- 图片交互舞台 -->
  <div class="gallery-stage" id="galleryStage"></div>
  <div class="effects-layer" id="effectsLayer" aria-live="polite"></div>

  <!-- 规则弹窗 -->
  <div class="rules-modal" id="rulesModal" hidden>
    <div class="rules-card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
      <h2 id="rulesTitle">玩法说明</h2>
      <ul class="rules-list">
        <li>移动鼠标可击打照片，照片会像气球一样弹开并互相碰撞。</li>
        <li>按住 <strong>Space</strong>：照片组成爱心形状。</li>
        <li>按住 <strong>A-Z / 0-9</strong>：照片组成对应字母或数字的实心形状。</li>
        <li>按住 <strong>Shift</strong> 时再触发形状：进入高规整模式，形状更工整。</li>
        <li>左键点击照片会触发烟花和情话，几秒后会重生同款照片。</li>
      </ul>
      <button type="button" class="rules-close" id="rulesCloseBtn">我知道啦</button>
    </div>
  </div>

  <script src="js/heart-rain.js"></script>
  <script src="js/shape-points.js"></script>
  <script src="js/db.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
